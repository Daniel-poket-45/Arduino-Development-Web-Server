<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>ADWS - Web</title>
    <style>
        /* Remove qualquer margem da página e trava barras de rolagem indesejadas */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121212; /* Cor de fundo ao redor, caso necessário */
        }

        /* Faz o canvas preencher 100% da área útil da aba do navegador */
        canvas.emscripten {
            border: 0px none;
            background-color: rgb(202, 174, 174);
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    {{{ SCRIPT }}}
</body>
</html>
